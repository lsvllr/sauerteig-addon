# Version setzt die GitHub Action bei jedem Build auf das Tag des Images (sha-<7 Zeichen>).
name: Sauerteig-Rechner
description: Vollkornbrot aus Roggen, Dinkel, Weizen und Buchweizen
version: "sha-23be1b1"
slug: sauerteig
url: https://github.com/lsvllr/sauerteig-addon
arch:
  - aarch64
  - amd64
image: ghcr.io/lsvllr/sauerteig-rechner
init: false
startup: application
boot: auto
# HA startet das Add-on neu, wenn /healthz nicht mehr antwortet.
watchdog: http://[HOST]:[PORT:8080]/healthz
# Daten in /data: sauerteig.db (Konten, Rezepte, Push-Abos, laufende Back-Timer) und ggf. vapid.json.
# Während der HA-Sicherung kurz stoppen: SQLite wird dann sauber gesichert.
backup: cold
timeout: 20
# Kein Port nach außen: erreichbar im HA-Netz unter <Hostname>:8080 (Hostname auf der Info-Seite),
# öffentlich über das Cloudflared-Add-on.
options:
  app_url: "https://sauerteig.vollrath.app"
  admin_password: ""
  vapid_public_key: ""
  vapid_private_key: ""
schema:
  app_url: url
  admin_password: password?
  vapid_public_key: str?
  vapid_private_key: password?
